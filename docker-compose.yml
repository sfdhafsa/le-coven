services:
  postgres:
    image: postgres:17
    container_name: lecoven-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lecoven
      POSTGRES_USER: lecoven_user
      POSTGRES_PASSWORD: lecoven_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecoven_user -d lecoven"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
